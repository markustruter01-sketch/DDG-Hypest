openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication
  - name: programs
    description: Creator drafts and published programs
  - name: creators
    description: Public creator pages and creator links
  - name: library
    description: Programs a buyer owns, and the lessons inside them
  - name: coaching
    description: AI coaches, plans, sessions, logging and progress
  - name: billing
    description: Stripe Checkout and the billing portal. Access itself is granted only by the Stripe webhook (POST /billing/webhook, server-to-server, not in this client spec).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account
      description: Creates a user and sets the hypest_session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: Checks email and password and sets the hypest_session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Deletes the session row for the hypest_session cookie and clears that cookie.
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the current user
      description: Updates display_name, bio and handle. Omitted fields stay unchanged. handle can only be set once (409 if already set or taken).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Link name already set or taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Delete my account
      description: Cancels any Stripe subscription first (nothing is deleted if that fails), then deletes training answers, plans, logs and logins. Payment records are kept without personal details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Deleted and logged out
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Stripe could not cancel the membership; nothing was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Payments are off, so the membership can't be cancelled; nothing was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change my password (logs out every other device)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Current password is wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a reset link. Same answer whether or not the email has an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: If the email has an account, a link was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Email isn't set up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with a reset link's token; logs out everywhere, then logs in here
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid, expired or used link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: Log out on every device
      responses:
        "204":
          description: All sessions deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/export:
    get:
      operationId: exportMyData
      tags: [auth]
      summary: Download everything Hypest holds about me, as JSON
      responses:
        "200":
          description: My data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/reminders:
    get:
      operationId: getReminders
      tags: [coaching]
      summary: Are reminder emails on for me, and can Hypest send email at all?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemindersState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    put:
      operationId: setReminders
      tags: [coaching]
      summary: Turn reminder emails on or off (an email when I miss 3 days of an active plan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemindersRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemindersState"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /reminders/off:
    post:
      operationId: turnOffReminders
      tags: [coaching]
      summary: The "turn these off" link in a reminder email. No login needed; the token only turns reminders off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnOffRemindersRequest"
      responses:
        "204":
          description: Off (same answer for an unknown token)
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /client-errors:
    post:
      operationId: reportClientError
      tags: [health]
      summary: The app tells the server it crashed (no personal details; capped; never fails the page)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "204":
          description: Noted (or dropped by the rate cap)
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs:
    get:
      operationId: listPublishedPrograms
      tags: [programs]
      summary: List published programs
      description: Public. Published programs only, with no lesson content. Optional creator filters to one creator's link name.
      parameters:
        - name: creator
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Published programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProgram"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a draft program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine:
    get:
      operationId: listMyPrograms
      tags: [programs]
      summary: List the current user's programs
      responses:
        "200":
          description: Programs owned by the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyProgramSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}:
    get:
      operationId: getMyProgram
      tags: [programs]
      summary: Get one of the current user's programs, including lessons
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Program with lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateMyProgram
      tags: [programs]
      summary: Update one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramRequest"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/lessons:
    post:
      operationId: createLesson
      tags: [programs]
      summary: Add a lesson to one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonWriteRequest"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/lessons/reorder:
    post:
      operationId: reorderLessons
      tags: [programs]
      summary: Reorder lessons in one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderLessonsRequest"
      responses:
        "200":
          description: Lessons in the new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/lessons/{lessonId}:
    patch:
      operationId: updateLesson
      tags: [programs]
      summary: Update a lesson in one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/LessonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonPatchRequest"
      responses:
        "200":
          description: Updated lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteLesson
      tags: [programs]
      summary: Delete a lesson from one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/LessonId"
      responses:
        "204":
          description: Lesson deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/publish:
    post:
      operationId: publishProgram
      tags: [programs]
      summary: Publish one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Published program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "400":
          description: Program cannot be published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/unpublish:
    post:
      operationId: unpublishProgram
      tags: [programs]
      summary: Unpublish one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Unpublished program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/{id}:
    get:
      operationId: getPublishedProgram
      tags: [programs]
      summary: Get one published program
      description: Public. Published programs only, with no lesson content.
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Published program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProgram"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /creators/{handle}:
    get:
      operationId: getCreator
      tags: [creators]
      summary: Public creator profile
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200":
          description: Creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCreator"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /creators/{handle}/visit:
    post:
      operationId: recordCreatorVisit
      tags: [creators]
      summary: Record that a visitor arrived through this creator's link
      description: Sets a 30-day referral cookie; if logged in, also saves it on the account. Last link wins. Ignored for the creator's own visits.
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Recorded
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /home:
    get:
      operationId: getHome
      tags: [library]
      summary: Public showcase numbers for the Home page
      description: Real data only. paid_out_cents is null until real (non-test) money has been paid. ranking is "sales" once any real sale exists, otherwise "new".
      responses:
        "200":
          description: Home showcase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeShowcase"
  /config:
    get:
      operationId: getConfig
      tags: [health]
      summary: Public app settings the web app needs
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
  /library:
    get:
      operationId: listLibrary
      tags: [library]
      summary: Programs the current user has bought, newest first
      responses:
        "200":
          description: Owned programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /library/{id}:
    get:
      operationId: getLibraryProgram
      tags: [library]
      summary: A program with its lessons, for a buyer who owns it or its creator
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Program with lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Not bought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/{id}/test-purchase:
    post:
      operationId: testPurchase
      tags: [library]
      summary: DEVELOPMENT ONLY. Grant access as if bought, with no payment. 404 outside development.
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "201":
          description: Test purchase recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          description: Cannot buy own program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /coaches:
    get:
      operationId: listCoaches
      tags: [coaching]
      summary: The AI coaches
      responses:
        "200":
          description: Coaches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coach"
  /coaching/preview:
    post:
      operationId: previewPlan
      tags: [coaching]
      summary: Public. Week 1 of the plan these answers would get; nothing is saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswers"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "400":
          description: Invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /onboarding/draft:
    put:
      operationId: saveOnboardingDraft
      tags: [coaching]
      summary: Public. Keep these answers for a day so signup or login (in any tab) saves them as the profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswers"
      responses:
        "204":
          description: Saved; the hypest_draft cookie holds the key
        "400":
          description: Invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/training:
    get:
      operationId: getTraining
      tags: [coaching]
      summary: Onboarding answers, access level and current plan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/training/profile:
    put:
      operationId: saveTrainingProfile
      tags: [coaching]
      summary: Save onboarding answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswers"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingState"
        "400":
          description: Invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/training/units:
    put:
      operationId: setUnits
      tags: [coaching]
      summary: Show weights in kg or lb. Loads are always stored in kg.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingState"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No training profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/plans:
    post:
      operationId: createPlan
      tags: [coaching]
      summary: Build a plan from the saved answers. Uses a plan credit, or a Tier 1/2 membership (members may replace a current plan).
      responses:
        "201":
          description: Plan built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs a plan or membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No saved answers, or a plan is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/plans/next:
    post:
      operationId: createNextPlan
      tags: [coaching]
      summary: Finish the current block and build the next one (Tier 1/2). Tier 2 uses the logs to set loads.
      responses:
        "201":
          description: Next block built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs a membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No current plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/plans/resume:
    post:
      operationId: resumePlan
      tags: [coaching]
      summary: Resume a plan paused by a safety stop, after the member confirms they were cleared
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "400":
          description: The member did not confirm they were cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Nothing to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      tags: [coaching]
      summary: Mark a session done
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSessionView"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/items/{itemId}/sets/{setNumber}:
    put:
      operationId: logSet
      tags: [coaching]
      summary: Save one set (Tier 2)
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/SetNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLogInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetLog"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs Tier 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/items/{itemId}/hurts:
    post:
      operationId: reportPain
      tags: [coaching]
      summary: This hurts. Warning words pause the plan on every tier; a gentler swap is Tier 2.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PainReport"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PainResult"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/plans/history:
    get:
      operationId: listPastPlans
      tags: [coaching]
      summary: Finished and replaced blocks, newest first (not the current one)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PastPlan"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/coach/messages:
    get:
      operationId: getCoachChat
      tags: [coaching]
      summary: Chat with your coach (Coaching members, when AI is on)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachChat"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: sendCoachMessage
      tags: [coaching]
      summary: Send your coach a message. Warning words get a fixed safety reply (no AI) and pause the plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: The chat, with the coach's reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachChat"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs Coaching
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Pick a coach first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Daily message limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Chat is off, or the coach can't reply right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [health]
      summary: Owner's view of Hypest (ADMIN_EMAILS only; 404 for everyone else)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/progress:
    get:
      operationId: getProgress
      tags: [coaching]
      summary: Streak, best lifts and weekly volume (Tier 2)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs Tier 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dev/unlock:
    post:
      operationId: devUnlock
      tags: [coaching]
      summary: DEVELOPMENT ONLY. Grant a test membership with no payment. 404 outside development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Intro already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Start a Stripe Checkout for a plan or membership. Returns the Stripe page to send the member to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Stripe Checkout page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeLink"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Intro already used, or already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Stripe could not be reached. Nothing was charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Payments are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /billing/confirm:
    post:
      operationId: confirmCheckout
      tags: [billing]
      summary: Back from Stripe Checkout. The server reads the session from Stripe and unlocks access at once (the webhook stays the backup).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutConfirmRequest"
      responses:
        "200":
          description: Applied (or already applied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutConfirmation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not this member's checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Stripe could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Payments are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Open the Stripe billing portal (cancel, update card, invoices).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalRequest"
      responses:
        "200":
          description: Stripe billing portal page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeLink"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No billing account yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Stripe could not be reached. Nothing was charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Payments are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    SetNumber:
      name: setNumber
      in: path
      required: true
      schema:
        type: integer
    Handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
      required:
        - message
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: string
        bio:
          type: string
          nullable: true
        handle:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
          description: The member's IANA time zone (e.g. America/New_York); null until their browser sends one
      required:
        - id
        - email
        - display_name
        - bio
        - handle
        - timezone
    SignupRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        adult_confirmed:
          type: boolean
          const: true
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: The browser's IANA time zone; an unknown name is ignored
      required:
        - email
        - password
        - display_name
        - adult_confirmed
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        bio:
          type: string
          maxLength: 500
          nullable: true
        handle:
          type: string
          pattern: "^[a-z0-9_]{3,30}$"
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA time zone, e.g. America/New_York (400 if unknown)
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 200
      required:
        - email
        - password
    PublicProgram:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        price_cents:
          type: integer
        creator_display_name:
          type: string
        creator_handle:
          type: string
          nullable: true
        lesson_count:
          type: integer
      required:
        - id
        - title
        - description
        - price_cents
        - creator_display_name
        - creator_handle
        - lesson_count
    HomeShowcase:
      type: object
      additionalProperties: false
      properties:
        creators:
          type: integer
        live_programs:
          type: integer
        paid_out_cents:
          type: integer
          nullable: true
        ranking:
          type: string
          enum: [sales, new]
        top_creators:
          type: array
          items:
            $ref: "#/components/schemas/ShowcaseCreator"
      required:
        - creators
        - live_programs
        - paid_out_cents
        - ranking
        - top_creators
    ShowcaseCreator:
      type: object
      additionalProperties: false
      properties:
        handle:
          type: string
        display_name:
          type: string
        live_programs:
          type: integer
        sales:
          type: integer
      required:
        - handle
        - display_name
        - live_programs
        - sales
    Coach:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        name: {type: string}
        discipline: {type: string}
        title: {type: string}
        personality: {type: string}
        good_for: {type: string}
        photo: {type: string}
        goals:
          type: array
          items: {type: string}
      required: [id, name, discipline, title, personality, good_for, photo, goals]
    RemindersState:
      type: object
      additionalProperties: false
      properties:
        "on": {type: boolean}
        available:
          type: boolean
          description: Hypest can send email (EMAIL_* set). When false the app hides the switch.
      required: ["on", available]
    RemindersRequest:
      type: object
      additionalProperties: false
      properties:
        "on": {type: boolean}
      required: ["on"]
    TurnOffRemindersRequest:
      type: object
      additionalProperties: false
      properties:
        token: {type: string, minLength: 43, maxLength: 43}
      required: [token]
    ClientErrorReport:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [crash, unhandled]
        message: {type: string, maxLength: 500}
        path: {type: string, maxLength: 200}
      required: [kind, message, path]
    UnitsRequest:
      type: object
      additionalProperties: false
      properties:
        units:
          type: string
          enum: [kg, lb]
      required: [units]
    TrainingAnswers:
      type: object
      additionalProperties: false
      properties:
        coach_id: {type: string}
        goal:
          type: string
          enum: [strength, muscle, fat_loss, fitness, mobility, endurance, performance]
        experience:
          type: string
          enum: [beginner, intermediate, advanced]
        days_per_week: {type: integer, minimum: 2, maximum: 6}
        minutes:
          type: integer
          enum: [20, 30, 45, 60]
        equipment:
          type: array
          items:
            type: string
            enum: [dumbbells, kettlebell, barbell, machines, bands, pullup_bar, cardio_machine, pool]
        avoid_areas:
          type: array
          items:
            type: string
            enum: [knee, lower_back, shoulder, wrist, hip, ankle, neck]
        units:
          type: string
          enum: [kg, lb]
        health_accepted:
          type: boolean
          enum: [true]
        screening:
          $ref: "#/components/schemas/ScreeningAnswers"
      required: [coach_id, goal, experience, days_per_week, minutes, equipment, avoid_areas, health_accepted]
    ScreeningAnswers:
      type: object
      additionalProperties: false
      description: Answers to the health check (one per question in AppConfig.screening, in order). Required when saving the profile; never returned.
      properties:
        answers:
          type: array
          maxItems: 20
          items: {type: boolean}
        cleared:
          type: boolean
          description: The member confirmed a doctor or health professional cleared them (needed if any answer is yes)
      required: [answers, cleared]
    Screening:
      type: object
      additionalProperties: false
      properties:
        version: {type: string}
        questions:
          type: array
          items: {type: string}
        yes_advice: {type: string}
        cleared_label: {type: string}
      required: [version, questions, yes_advice, cleared_label]
    Access:
      type: object
      additionalProperties: false
      properties:
        level:
          type: string
          enum: [none, plan, tier1, tier2]
        intro_available: {type: boolean}
        plan_credits: {type: integer}
      required: [level, intro_available, plan_credits]
    SetLog:
      type: object
      additionalProperties: false
      properties:
        set_number: {type: integer}
        reps: {type: integer, nullable: true}
        seconds: {type: integer, nullable: true}
        load_kg: {type: number, nullable: true}
      required: [set_number, reps, seconds, load_kg]
    SetLogInput:
      type: object
      additionalProperties: false
      properties:
        reps: {type: integer, nullable: true, minimum: 0, maximum: 200}
        seconds: {type: integer, nullable: true, minimum: 0, maximum: 7200}
        load_kg: {type: number, nullable: true, minimum: 0, maximum: 1000}
      required: [reps, seconds, load_kg]
    PlanItemView:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, nullable: true}
        exercise_id: {type: string}
        name: {type: string}
        cue: {type: string}
        measure:
          type: string
          enum: [reps, time]
        weighted: {type: boolean}
        sets: {type: integer}
        reps: {type: integer, nullable: true}
        seconds: {type: integer, nullable: true}
        rest_seconds: {type: integer}
        target_load_kg: {type: number, nullable: true}
        swapped_from: {type: string, nullable: true}
        logs:
          type: array
          items:
            $ref: "#/components/schemas/SetLog"
      required: [id, exercise_id, name, cue, measure, weighted, sets, reps, seconds, rest_seconds, target_load_kg, swapped_from, logs]
    PlanSessionView:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, nullable: true}
        week: {type: integer}
        day: {type: integer}
        title: {type: string}
        note: {type: string, nullable: true, description: "One line from the coach (AI layer); null when AI is off"}
        completed_at: {type: string, nullable: true}
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItemView"
      required: [id, week, day, title, note, completed_at, items]
    PlanView:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, nullable: true}
        coach_id: {type: string}
        block: {type: integer}
        weeks: {type: integer}
        days_per_week: {type: integer}
        status:
          type: string
          enum: [preview, active, paused, done]
        paused_reason: {type: string, nullable: true}
