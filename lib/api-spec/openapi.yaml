openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication
  - name: programs
    description: Creator drafts and published programs
  - name: creators
    description: Public creator pages and creator links
  - name: library
    description: Programs a buyer owns, and the lessons inside them
  - name: coaching
    description: AI coaches, plans, sessions, logging and progress
  - name: billing
    description: Stripe Checkout and the billing portal. Access itself is granted only by the Stripe webhook (POST /billing/webhook, server-to-server, not in this client spec).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account
      description: Creates a user and sets the hypest_session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: Checks email and password and sets the hypest_session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Deletes the session row for the hypest_session cookie and clears that cookie.
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the current user
      description: Updates display_name, bio and handle. Omitted fields stay unchanged. handle can only be set once (409 if already set or taken).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Link name already set or taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs:
    get:
      operationId: listPublishedPrograms
      tags: [programs]
      summary: List published programs
      description: Public. Published programs only, with no lesson content. Optional creator filters to one creator's link name.
      parameters:
        - name: creator
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Published programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProgram"
    post:
      operationId: createProgram
      tags: [programs]
      summary: Create a draft program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine:
    get:
      operationId: listMyPrograms
      tags: [programs]
      summary: List the current user's programs
      responses:
        "200":
          description: Programs owned by the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyProgramSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}:
    get:
      operationId: getMyProgram
      tags: [programs]
      summary: Get one of the current user's programs, including lessons
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Program with lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateMyProgram
      tags: [programs]
      summary: Update one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramRequest"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/lessons:
    post:
      operationId: createLesson
      tags: [programs]
      summary: Add a lesson to one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonWriteRequest"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/lessons/reorder:
    post:
      operationId: reorderLessons
      tags: [programs]
      summary: Reorder lessons in one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderLessonsRequest"
      responses:
        "200":
          description: Lessons in the new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/lessons/{lessonId}:
    patch:
      operationId: updateLesson
      tags: [programs]
      summary: Update a lesson in one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/LessonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonPatchRequest"
      responses:
        "200":
          description: Updated lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteLesson
      tags: [programs]
      summary: Delete a lesson from one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/LessonId"
      responses:
        "204":
          description: Lesson deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/publish:
    post:
      operationId: publishProgram
      tags: [programs]
      summary: Publish one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Published program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "400":
          description: Program cannot be published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/mine/{id}/unpublish:
    post:
      operationId: unpublishProgram
      tags: [programs]
      summary: Unpublish one of the current user's programs
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Unpublished program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/{id}:
    get:
      operationId: getPublishedProgram
      tags: [programs]
      summary: Get one published program
      description: Public. Published programs only, with no lesson content.
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Published program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProgram"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /creators/{handle}:
    get:
      operationId: getCreator
      tags: [creators]
      summary: Public creator profile
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200":
          description: Creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCreator"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /creators/{handle}/visit:
    post:
      operationId: recordCreatorVisit
      tags: [creators]
      summary: Record that a visitor arrived through this creator's link
      description: Sets a 30-day referral cookie; if logged in, also saves it on the account. Last link wins. Ignored for the creator's own visits.
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "204":
          description: Recorded
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /home:
    get:
      operationId: getHome
      tags: [library]
      summary: Public showcase numbers for the Home page
      description: Real data only. paid_out_cents is null until real (non-test) money has been paid. ranking is "sales" once any real sale exists, otherwise "new".
      responses:
        "200":
          description: Home showcase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeShowcase"
  /config:
    get:
      operationId: getConfig
      tags: [health]
      summary: Public app settings the web app needs
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
  /library:
    get:
      operationId: listLibrary
      tags: [library]
      summary: Programs the current user has bought, newest first
      responses:
        "200":
          description: Owned programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /library/{id}:
    get:
      operationId: getLibraryProgram
      tags: [library]
      summary: A program with its lessons, for a buyer who owns it or its creator
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: Program with lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryProgram"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Not bought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /programs/{id}/test-purchase:
    post:
      operationId: testPurchase
      tags: [library]
      summary: DEVELOPMENT ONLY. Grant access as if bought, with no payment. 404 outside development.
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "201":
          description: Test purchase recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400":
          description: Cannot buy own program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /coaches:
    get:
      operationId: listCoaches
      tags: [coaching]
      summary: The AI coaches
      responses:
        "200":
          description: Coaches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coach"
  /coaching/preview:
    post:
      operationId: previewPlan
      tags: [coaching]
      summary: Public. Week 1 of the plan these answers would get; nothing is saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswers"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "400":
          description: Invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/training:
    get:
      operationId: getTraining
      tags: [coaching]
      summary: Onboarding answers, access level and current plan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/training/profile:
    put:
      operationId: saveTrainingProfile
      tags: [coaching]
      summary: Save onboarding answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAnswers"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingState"
        "400":
          description: Invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/plans:
    post:
      operationId: createPlan
      tags: [coaching]
      summary: Build a plan from the saved answers. Uses a plan credit, or a Tier 1/2 membership (members may replace a current plan).
      responses:
        "201":
          description: Plan built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs a plan or membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No saved answers, or a plan is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/plans/next:
    post:
      operationId: createNextPlan
      tags: [coaching]
      summary: Finish the current block and build the next one (Tier 1/2). Tier 2 uses the logs to set loads.
      responses:
        "201":
          description: Next block built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs a membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No current plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/plans/resume:
    post:
      operationId: resumePlan
      tags: [coaching]
      summary: Resume a plan paused by a safety stop, after the member confirms they were cleared
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanView"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Nothing to resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      tags: [coaching]
      summary: Mark a session done
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSessionView"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/items/{itemId}/sets/{setNumber}:
    put:
      operationId: logSet
      tags: [coaching]
      summary: Save one set (Tier 2)
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/SetNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLogInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetLog"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs Tier 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/items/{itemId}/hurts:
    post:
      operationId: reportPain
      tags: [coaching]
      summary: This hurts. Warning words pause the plan on every tier; a gentler swap is Tier 2.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PainReport"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PainResult"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /me/progress:
    get:
      operationId: getProgress
      tags: [coaching]
      summary: Streak, best lifts and weekly volume (Tier 2)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "402":
          description: Needs Tier 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /dev/unlock:
    post:
      operationId: devUnlock
      tags: [coaching]
      summary: DEVELOPMENT ONLY. Grant a test membership with no payment. 404 outside development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Intro already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Start a Stripe Checkout for a plan or membership. Returns the Stripe page to send the member to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Stripe Checkout page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeLink"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Intro already used, or already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Stripe could not be reached. Nothing was charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Payments are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Open the Stripe billing portal (cancel, update card, invoices).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalRequest"
      responses:
        "200":
          description: Stripe billing portal page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeLink"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: No billing account yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Stripe could not be reached. Nothing was charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: Payments are off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    SetNumber:
      name: setNumber
      in: path
      required: true
      schema:
        type: integer
    Handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
    ProgramId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
      required:
        - message
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        email:
          type: string
        display_name:
          type: string
        bio:
          type: string
          nullable: true
        handle:
          type: string
          nullable: true
      required:
        - id
        - email
        - display_name
        - bio
        - handle
    SignupRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        adult_confirmed:
          type: boolean
          const: true
      required:
        - email
        - password
        - display_name
        - adult_confirmed
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        bio:
          type: string
          maxLength: 500
          nullable: true
        handle:
          type: string
          pattern: "^[a-z0-9_]{3,30}$"
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 200
      required:
        - email
        - password
    PublicProgram:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        price_cents:
          type: integer
        creator_display_name:
          type: string
        creator_handle:
          type: string
          nullable: true
        lesson_count:
          type: integer
      required:
        - id
        - title
        - description
        - price_cents
        - creator_display_name
        - creator_handle
        - lesson_count
    HomeShowcase:
      type: object
      additionalProperties: false
      properties:
        creators:
          type: integer
        live_programs:
          type: integer
        paid_out_cents:
          type: integer
          nullable: true
        ranking:
          type: string
          enum: [sales, new]
        top_creators:
          type: array
          items:
            $ref: "#/components/schemas/ShowcaseCreator"
      required:
        - creators
        - live_programs
        - paid_out_cents
        - ranking
        - top_creators
    ShowcaseCreator:
      type: object
      additionalProperties: false
      properties:
        handle:
          type: string
        display_name:
          type: string
        live_programs:
          type: integer
        sales:
          type: integer
      required:
        - handle
        - display_name
        - live_programs
        - sales
    Coach:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        name: {type: string}
        discipline: {type: string}
        title: {type: string}
        personality: {type: string}
        good_for: {type: string}
        photo: {type: string}
        goals:
          type: array
          items: {type: string}
      required: [id, name, discipline, title, personality, good_for, photo, goals]
    TrainingAnswers:
      type: object
      additionalProperties: false
      properties:
        coach_id: {type: string}
        goal:
          type: string
          enum: [strength, muscle, fat_loss, fitness, mobility, endurance, performance]
        experience:
          type: string
          enum: [beginner, intermediate, advanced]
        days_per_week: {type: integer, minimum: 2, maximum: 6}
        minutes:
          type: integer
          enum: [20, 30, 45, 60]
        equipment:
          type: array
          items:
            type: string
            enum: [dumbbells, kettlebell, barbell, machines, bands, pullup_bar, cardio_machine, pool]
        avoid_areas:
          type: array
          items:
            type: string
            enum: [knee, lower_back, shoulder, wrist, hip, ankle, neck]
        units:
          type: string
          enum: [kg, lb]
        health_accepted:
          type: boolean
          enum: [true]
      required: [coach_id, goal, experience, days_per_week, minutes, equipment, avoid_areas, health_accepted]
    Access:
      type: object
      additionalProperties: false
      properties:
        level:
          type: string
          enum: [none, plan, tier1, tier2]
        intro_available: {type: boolean}
        plan_credits: {type: integer}
      required: [level, intro_available, plan_credits]
    SetLog:
      type: object
      additionalProperties: false
      properties:
        set_number: {type: integer}
        reps: {type: integer, nullable: true}
        seconds: {type: integer, nullable: true}
        load_kg: {type: number, nullable: true}
      required: [set_number, reps, seconds, load_kg]
    SetLogInput:
      type: object
      additionalProperties: false
      properties:
        reps: {type: integer, nullable: true, minimum: 0, maximum: 200}
        seconds: {type: integer, nullable: true, minimum: 0, maximum: 7200}
        load_kg: {type: number, nullable: true, minimum: 0, maximum: 1000}
      required: [reps, seconds, load_kg]
    PlanItemView:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, nullable: true}
        exercise_id: {type: string}
        name: {type: string}
        cue: {type: string}
        measure:
          type: string
          enum: [reps, time]
        weighted: {type: boolean}
        sets: {type: integer}
        reps: {type: integer, nullable: true}
        seconds: {type: integer, nullable: true}
        rest_seconds: {type: integer}
        target_load_kg: {type: number, nullable: true}
        swapped_from: {type: string, nullable: true}
        logs:
          type: array
          items:
            $ref: "#/components/schemas/SetLog"
      required: [id, exercise_id, name, cue, measure, weighted, sets, reps, seconds, rest_seconds, target_load_kg, swapped_from, logs]
    PlanSessionView:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, nullable: true}
        week: {type: integer}
        day: {type: integer}
        title: {type: string}
        completed_at: {type: string, nullable: true}
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItemView"
      required: [id, week, day, title, completed_at, items]
    PlanView:
      type: object
      additionalProperties: false
      properties:
        id: {type: integer, nullable: true}
        coach_id: {type: string}
        block: {type: integer}
        weeks: {type: integer}
        days_per_week: {type: integer}
        status:
          type: string
          enum: [preview, active, paused, done]
        paused_reason: {type: string, nullable: true}
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PlanSessionView"
      required: [id, coach_id, block, weeks, days_per_week, status, paused_reason, sessions]
    TrainingState:
      type: object
      additionalProperties: false
      properties:
        profile:
          allOf:
            - $ref: "#/components/schemas/TrainingAnswers"
          nullable: true
        access:
          $ref: "#/components/schemas/Access"
        plan:
          allOf:
            - $ref: "#/components/schemas/PlanView"
          nullable: true
      required: [profile, access, plan]
    PainReport:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
        area:
          type: string
          enum: [knee, lower_back, shoulder, wrist, hip, ankle, neck]
      required: [text]
    PainResult:
      type: object
      additionalProperties: false
      properties:
        stopped: {type: boolean}
        message: {type: string}
        swapped_to: {type: string, nullable: true}
        needs_tier2: {type: boolean}
      required: [stopped, message, swapped_to, needs_tier2]
    Progress:
      type: object
      additionalProperties: false
      properties:
        streak_days: {type: integer}
        sessions_done: {type: integer}
        best_lifts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              exercise_id: {type: string}
              name: {type: string}
              load_kg: {type: number}
              reps: {type: integer}
            required: [exercise_id, name, load_kg, reps]
        weekly_volume:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              week_start: {type: string}
              volume_kg: {type: number}
            required: [week_start, volume_kg]
      required: [streak_days, sessions_done, best_lifts, weekly_volume]
    UnlockRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [intro_plan, plan, tier1, tier2]
      required: [kind]
    Prices:
      type: object
      additionalProperties: false
      properties:
        intro_plan_cents: {type: integer}
        plan_cents: {type: integer}
        tier1_cents: {type: integer}
        tier2_cents: {type: integer}
      required: [intro_plan_cents, plan_cents, tier1_cents, tier2_cents]
    CheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [intro_plan, plan, tier1, tier2]
        return_url:
          type: string
          description: Page on this site to come back to after Stripe
      required: [kind, return_url]
    PortalRequest:
      type: object
      additionalProperties: false
      properties:
        return_url:
          type: string
      required: [return_url]
    StripeLink:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
      required: [url]
    AppConfig:
      type: object
      additionalProperties: false
      properties:
        dev_tools:
          type: boolean
        payments:
          type: string
          enum: ["off", test, live]
          description: off = no Stripe keys (dev unlock only); test = Stripe test mode, no real charge; live = real money
        creator_brought_bps:
          type: integer
          description: Hypest's fee on sales through the creator's own link, in basis points (1000 = 10%)
        hypest_found_bps:
          type: integer
          description: Hypest's fee on sales Hypest found, in basis points
        prices:
          $ref: "#/components/schemas/Prices"
      required:
        - prices
        - payments
        - dev_tools
        - creator_brought_bps
        - hypest_found_bps
    LibraryProgram:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        creator_display_name:
          type: string
        creator_handle:
          type: string
          nullable: true
        is_creator:
          type: boolean
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
      required:
        - id
        - title
        - description
        - creator_display_name
        - creator_handle
        - is_creator
        - lessons
    Purchase:
      type: object
      additionalProperties: false
      properties:
        program_id:
          type: integer
        price_cents:
          type: integer
        commission_source:
          type: string
          enum: [creator_brought, hypest_found]
        commission_bps:
          type: integer
        status:
          type: string
          enum: [paid, test]
      required:
        - program_id
        - price_cents
        - commission_source
        - commission_bps
        - status
    PublicCreator:
      type: object
      additionalProperties: false
      properties:
        handle:
          type: string
        display_name:
          type: string
        bio:
          type: string
          nullable: true
      required:
        - handle
        - display_name
        - bio
    MyProgramSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        price_cents:
          type: integer
        status:
          type: string
          enum: [draft, published]
        lesson_count:
          type: integer
      required:
        - id
        - title
        - description
        - price_cents
        - status
        - lesson_count
    Lesson:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        position:
          type: integer
        title:
          type: string
        body:
          type: string
          nullable: true
        sets:
          type: integer
          nullable: true
        reps:
          type: integer
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        media_source:
          type: string
          nullable: true
          enum: [youtube]
        media_ref:
          type: string
          nullable: true
      required:
        - id
        - position
        - title
        - body
        - sets
        - reps
        - duration_seconds
        - media_source
        - media_ref
    MyProgram:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        price_cents:
          type: integer
        status:
          type: string
          enum: [draft, published]
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
      required:
        - id
        - title
        - description
        - price_cents
        - status
        - lessons
    CreateProgramRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          nullable: true
        price_cents:
          type: integer
          minimum: 500
      required:
        - title
        - price_cents
    UpdateProgramRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          nullable: true
        price_cents:
          type: integer
          minimum: 500
    LessonWriteRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 5000
          nullable: true
        sets:
          type: integer
          minimum: 0
          nullable: true
        reps:
          type: integer
          minimum: 0
          nullable: true
        duration_seconds:
          type: integer
          minimum: 0
          nullable: true
        media_source:
          type: string
          nullable: true
          enum: [youtube]
        media_ref:
          type: string
          nullable: true
      required:
        - title
    LessonPatchRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 5000
          nullable: true
        sets:
          type: integer
          minimum: 0
          nullable: true
        reps:
          type: integer
          minimum: 0
          nullable: true
        duration_seconds:
          type: integer
          minimum: 0
          nullable: true
        media_source:
          type: string
          nullable: true
          enum: [youtube]
        media_ref:
          type: string
          nullable: true
    ReorderLessonsRequest:
      type: object
      additionalProperties: false
      properties:
        lesson_ids:
          type: array
          items:
            type: integer
      required:
        - lesson_ids

