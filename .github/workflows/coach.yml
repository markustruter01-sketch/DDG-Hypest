# Every hour: asks the published Hypest app to send due coach check-ins and the Sunday weekly reviews (build plan 2.5).
# Each call does a small batch and answers {"more": true} while work is waiting, so this calls again (at most 30 times).
# Uses the same two repository secrets as daily.yml: HYPEST_URL and JOBS_TOKEN. Without them it just says so and stops.
name: coach
on:
  schedule:
    - cron: "7 * * * *"   # every hour, at 7 minutes past
  workflow_dispatch: {}
permissions: {}
jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run the coach job
        env:
          HYPEST_URL: ${{ secrets.HYPEST_URL }}
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
        run: |
          if [ -z "$HYPEST_URL" ] || [ -z "$JOBS_TOKEN" ]; then echo "HYPEST_URL or JOBS_TOKEN not set: skipped"; exit 0; fi
          for i in $(seq 1 30); do
            out=$(curl -fsS --max-time 150 -X POST -H "Authorization: Bearer $JOBS_TOKEN" "$HYPEST_URL/api/jobs/coach") || { echo "call failed: the next hourly run picks up what is left"; break; }
            echo "$out"
            echo "$out" | grep -q '"more":true' || break
          done
