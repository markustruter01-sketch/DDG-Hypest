# Runs scripts/check-all.sh on every pull request and on main, against a throwaway Postgres.
# No secrets are used: payments run with a dummy Stripe test key and never reach Stripe.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hypest_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/hypest_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated API client must match lib/api-spec/openapi.yaml. The freshly generated files are uploaded as
      # "generated" so a branch can commit them, and the job fails here when the committed ones differ.
      - name: API codegen matches the spec
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated
          path: |
            lib/api-zod/src/generated
            lib/api-client-react/src/generated
      - name: Generated code is committed
        run: |
          changed=$(git status --porcelain -- lib/api-zod/src/generated lib/api-client-react/src/generated)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Generated API code is out of date: commit the 'generated' artifact of this run (also in the log below, as a base64 tar)"
            echo "GENERATED-TAR-BEGIN"; tar czf - lib/api-zod/src/generated lib/api-client-react/src/generated | base64 -w0; echo; echo "GENERATED-TAR-END"
            exit 1
          fi
      - run: bash scripts/check-all.sh
